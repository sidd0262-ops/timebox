<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" preserveAspectRatio="xMidYMax slice">
  <!-- 해무 속 흑백 산수: 먼 봉우리부터 가까운 바위섬까지, 사이사이 바다 안개 -->
  <defs>
    <filter id="bleed" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="3" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="20" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.2"/>
    </filter>
    <filter id="soft" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="34" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="6"/>
    </filter>
    <filter id="fog" x="-10%" y="-60%" width="120%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.03" numOctaves="3" seed="17" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="60" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="14"/>
    </filter>
    <linearGradient id="w0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#2b2b2b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#262626" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#1e1e1e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141414" stop-opacity=".78"/>
      <stop offset=".6" stop-color="#141414" stop-opacity=".1"/>
      <stop offset="1" stop-color="#141414" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 아주 먼 봉우리 -->
  <path filter="url(#soft)" fill="url(#w0)"
    d="M0 250 C80 220 140 150 210 160 C270 168 300 110 360 96 C420 84 470 170 540 176 C610 182 650 120 720 112 C800 104 840 190 920 186 C990 182 1040 130 1110 140 C1150 146 1180 170 1200 180 L1200 560 L0 560Z"/>
  <rect x="-50" y="200" width="1300" height="90" fill="#f4f4f2" opacity=".75" filter="url(#fog)"/>

  <!-- 먼 산 -->
  <path filter="url(#soft)" fill="url(#w1)"
    d="M0 330 C110 290 170 226 250 240 C320 252 350 196 430 186 C512 176 556 262 640 268 C720 274 760 214 840 210 C930 206 980 280 1060 276 C1120 273 1170 250 1200 256 L1200 560 L0 560Z"/>
  <rect x="-50" y="290" width="1300" height="80" fill="#f4f4f2" opacity=".7" filter="url(#fog)"/>

  <!-- 가운데 산 -->
  <path filter="url(#bleed)" fill="url(#w2)"
    d="M0 410 C70 380 120 330 182 336 C240 342 262 300 320 296 C380 292 420 360 488 368 C560 376 600 330 664 322 C740 312 790 380 860 384 C930 388 980 340 1040 336 C1100 332 1150 360 1200 366 L1200 560 L0 560Z"/>
  <rect x="-50" y="380" width="1300" height="70" fill="#f4f4f2" opacity=".65" filter="url(#fog)"/>

  <!-- 가까운 바위섬 (진한 먹) -->
  <path filter="url(#bleed)" fill="url(#w3)"
    d="M720 560 C760 500 790 452 836 430 C872 412 900 446 940 432 C996 412 1030 364 1080 350 C1120 340 1160 368 1200 380 L1200 560Z"/>
  <path filter="url(#bleed)" fill="url(#w3)" opacity=".75"
    d="M0 560 L0 470 C30 452 70 428 112 432 C150 436 176 470 206 486 C236 502 262 530 290 560Z"/>

  <!-- 맨 앞 바다 안개 -->
  <rect x="-50" y="480" width="1300" height="120" fill="#f4f4f2" opacity=".55" filter="url(#fog)"/>

  <!-- 멀리 나는 새 몇 마리 -->
  <g fill="none" stroke="#2a2a2a" stroke-width="2.2" stroke-linecap="round" opacity=".45">
    <path d="M300 150 q8 -7 15 0 q7 -7 15 0"/>
    <path d="M338 132 q6 -5 11 0 q5 -5 11 0"/>
    <path d="M276 128 q5 -4 9 0 q4 -4 9 0"/>
  </g>
</svg>
